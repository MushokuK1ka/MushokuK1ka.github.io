        <h2>HTML基础</h2>
        <p>HTML是网页的骨架，定义了网页的结构。常用的标签有：</p>
        <ul>
            <li>&lt;header&gt; - 页眉</li>
            <li>&lt;main&gt; - 主要内容</li>
            <li>&lt;footer&gt; - 页脚</li>
            <li>&lt;article&gt; - 文章</li>
        </ul>
        
        <h2>CSS样式</h2>
        <p>CSS让网页变得美观。可以控制颜色、字体、布局等。</p>
        <p>CSS的三种使用方式：</p>
        <ul>
            <li>内联样式</li>
            <li>内部样式表</li>
            <li>外部样式表（推荐）</li>
        </ul>
